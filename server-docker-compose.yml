services:
  migrate:
    image: ghcr.io/parchlinux/kan-migrate:latest
    container_name: kan-migrate
    networks:
      - kan-network
    environment:
      - POSTGRES_URL=${POSTGRES_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  s3:
    image: zenko/cloudserver:latest
    container_name: kan-s3
    command: >
      bash -c '
        mkdir -p /data/data /data/meta
        node -e "const net=require(\"net\");net.createServer(s=>{const c=net.connect(8000,\"127.0.0.1\");s.pipe(c);c.pipe(s);s.on(\"error\",()=>{});c.on(\"error\",()=>{});}).listen(9000);" &
        exec /usr/src/app/docker-entrypoint.sh yarn start
      '
    environment:
      - SCALITY_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - SCALITY_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - ENDPOINT=kan.parchlinux.com,kan-minio,kan-s3,s3,localhost,127.0.0.1
      - S3DATAPATH=/data/data
      - S3METADATAPATH=/data/meta
    volumes:
      - kan_s3_data:/data
    restart: unless-stopped
    networks:
      kan-network:
        aliases:
          - kan-minio
          - s3
          - kan-s3

  s3-init:
    image: zenko/cloudserver:latest
    container_name: kan-s3-init
    depends_on:
      - s3
    networks:
      - kan-network
    restart: "no"
    command: >
      sh -c '
        sleep 5;
        node -e "
          const AWS = require(\"aws-sdk\");
          const s3 = new AWS.S3({
            endpoint: \"http://kan-s3:8000\",
            accessKeyId: process.env.SCALITY_ACCESS_KEY_ID,
            secretAccessKey: process.env.SCALITY_SECRET_ACCESS_KEY,
            s3ForcePathStyle: true,
            region: \"us-east-1\"
          });
          async function init() {
            for (const b of [\"avatars\", \"attachments\"]) {
              try {
                await s3.createBucket({ Bucket: b }).promise();
                console.log(\"Created bucket:\", b);
              } catch (e) {
                console.log(\"Bucket\", b, e.code || e.message);
              }
              try {
                const policy = {
                  Version: \"2012-10-17\",
                  Statement: [
                    {
                      Effect: \"Allow\",
                      Principal: \"*\",
                      Action: [\"s3:GetObject\"],
                      Resource: [\"arn:aws:s3:::\" + b + \"/*\"]
                    }
                  ]
                };
                await s3.putBucketPolicy({ Bucket: b, Policy: JSON.stringify(policy) }).promise();
                console.log(\"Policy set on:\", b);
              } catch (e) {
                console.log(\"Policy error on\", b, e.code || e.message);
              }
            }
          }
          init();
        "
      '
    environment:
      - SCALITY_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - SCALITY_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}

  web:
    image: ghcr.io/parchlinux/kan:latest
    container_name: kan-web
    ports:
      - "3090:3000"
    networks:
      - kan-network
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - POSTGRES_URL=${POSTGRES_URL}
      - NEXT_PUBLIC_ALLOW_CREDENTIALS=true
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_SECURE=${SMTP_SECURE}
      - EMAIL_FROM=${EMAIL_FROM}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_INTERNAL_ENDPOINT=${S3_INTERNAL_ENDPOINT}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE}
      - NEXT_PUBLIC_STORAGE_URL=${NEXT_PUBLIC_STORAGE_URL}
      - NEXT_PUBLIC_STORAGE_DOMAIN=${NEXT_PUBLIC_STORAGE_DOMAIN}
      - NEXT_PUBLIC_AVATAR_BUCKET_NAME=${NEXT_PUBLIC_AVATAR_BUCKET_NAME}
      - NEXT_PUBLIC_ATTACHMENTS_BUCKET_NAME=${NEXT_PUBLIC_ATTACHMENTS_BUCKET_NAME}
      - DISCOURSE_URL=${DISCOURSE_URL}
      - DISCOURSE_API_KEY=${DISCOURSE_API_KEY}
      - DISCOURSE_API_USER=${DISCOURSE_API_USER}
      - DISCOURSE_SSO_SECRET=${DISCOURSE_SSO_SECRET}
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: kan-db
    environment:
      - POSTGRES_DB=kan_db
      - POSTGRES_USER=kan
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - 5432:5432
    volumes:
      - kan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kan -d kan_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - kan-network

networks:
  kan-network:

volumes:
  kan_postgres_data:
  kan_s3_data:
