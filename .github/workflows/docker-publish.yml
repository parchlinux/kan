name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  # Only supersede PR builds. Branch and tag builds publish artifacts and
  # are allowed to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  MIGRATE_IMAGE_NAME: ${{ github.repository }}-migrate

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [web, migrate]
        platform: [linux/amd64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both are required: fetch-depth alone does not pull tags, and the
          # version step below degrades to a bare sha without them.
          fetch-depth: 0
          fetch-tags: true

      - name: Name the image and platform
        run: |
          if [[ "$TARGET" == "web" ]]; then IMAGE="$REGISTRY/$IMAGE_NAME"; else IMAGE="$REGISTRY/$MIGRATE_IMAGE_NAME"; fi
          echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
          echo "ARCH=${PLATFORM#linux/}" >> "$GITHUB_ENV"
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}

      # Set up BuildKit Docker container builder to be able to export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only; tags are applied once both halves exist, in the merge job
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      # Extract version from git tag or ref
      # Uses git describe to get latest tag + commit hash in SemVer format: 1.2.3+abc1234
      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            # Remove 'v' prefix if present
            VERSION="${VERSION#v}"
          else
            # Use git describe and simplify: v1.2.3-5-gabc1234 -> 1.2.3+abc1234
            GIT_DESCRIBE=$(git describe --tags --always --long 2>/dev/null || echo "")
            if [[ -n "$GIT_DESCRIBE" ]]; then
              # Match pattern: v1.2.3-5-gabc1234 (tag-commits-gcommit)
              if [[ "$GIT_DESCRIBE" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)-[0-9]+-g([a-f0-9]+)$ ]]; then
                # Format as tag+commit (SemVer build metadata)
                TAG_VERSION="${BASH_REMATCH[1]}"
                COMMIT_HASH="${BASH_REMATCH[2]}"
                VERSION="${TAG_VERSION}+${COMMIT_HASH:0:7}"
              elif [[ "$GIT_DESCRIBE" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
                # Exactly on a tag
                VERSION="${BASH_REMATCH[1]}"
              else
                # Fallback: just commit hash
                COMMIT_SHA="${{ github.sha }}"
                VERSION="${COMMIT_SHA:0:7}"
              fi
            else
              # No tags exist, use commit hash
              COMMIT_SHA="${{ github.sha }}"
              VERSION="${COMMIT_SHA:0:7}"
            fi
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      # Build and push by digest with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/web/Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          # Scoped per target and architecture: a shared scope means each
          # export overwrites the other's manifest and neither ever hits.
          cache-from: type=gha,scope=${{ matrix.target }}-${{ env.ARCH }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ env.ARCH }}

      - name: Save the digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload the digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.target }}-${{ env.ARCH }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    needs: build
    strategy:
      matrix:
        target: [web, migrate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Name the image
        run: |
          if [[ "$TARGET" == "web" ]]; then IMAGE="$REGISTRY/$IMAGE_NAME"; else IMAGE="$REGISTRY/$MIGRATE_IMAGE_NAME"; fi
          echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
        env:
          TARGET: ${{ matrix.target }}

      - name: Download the digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.target }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref_type == 'tag' }}
            type=raw,value=edge,enable={{is_default_branch}}

      # Join the amd64 and arm64 halves into one multi-arch tag
      - name: Publish the multi-arch image
        id: publish
        working-directory: /tmp/digests
        run: |
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          tags=()
          while read -r tag; do [[ -n "$tag" ]] && tags+=(-t "$tag"); done <<< "$TAGS"
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          first=$(head -n1 <<< "$TAGS")
          docker buildx imagetools inspect "$first"
